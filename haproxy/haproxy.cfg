# RhydaDB HAProxy - TLS termination + health checks
# Single-node, external HAProxy is the only entry point.
# RhydaDB itself has no auth/TLS (see docs/05), so firewall must block 9042 from the Internet.

global
    log stdout format raw local0
    maxconn 8192
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout check   5s
    retries 3

# CQL frontend: TLS -> plain to RhydaDB (9042)
# Generate cert: openssl req -x509 -newkey rsa:2048 -keyout /etc/haproxy/rhyda.key -out /etc/haproxy/rhyda.crt -days 365 -nodes -subj "/CN=rhyda"
frontend cql_tls
    bind *:9043 ssl crt /etc/haproxy/rhyda.pem alpn h2,http/1.1
    # Optional: require client cert (mTLS) - uncomment for prod
    # bind *:9043 ssl crt /etc/haproxy/rhyda.pem ca-file /etc/haproxy/ca.crt verify required
    default_backend cql_nodes

backend cql_nodes
    balance leastconn
    # Health check via CQL OPTIONS (native protocol) or via HTTP health (see below)
    # TCP check is cheapest and works even when RhydaDB is under GC
    option tcp-check
    tcp-check connect port 9042
    # CQL OPTIONS frame: version 0x04, flags 0, stream 0, opcode 0x05, length 0
    # haproxy 2.8+ supports `tcp-check send-binary` - for older use external check
    # tcp-check send-binary 040000000500000000
    # tcp-check expect binary 80000000
    default-server inter 2s rise 2 fall 3 maxconn 4096
    server rhyda1 127.0.0.1:9042 check

# HTTP health for k8s / haproxy http-check (RhydaDB health on 8080)
# Use this backend if you prefer HTTP health over TCP
frontend health_http
    bind *:8081
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    default_backend health_nodes

backend health_nodes
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 2s rise 2 fall 3
    server rhyda1 127.0.0.1:8080 check port 8080

# Prometheus metrics (optional): expose via HAProxy or directly from RhydaDB :8080/metrics
#frontend metrics
#    bind *:8404
#    http-request use-service prometheus-exporter
